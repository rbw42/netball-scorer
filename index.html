<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Official Netball Scorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { overscroll-behavior-y: none; }
        * { -webkit-tap-highlight-color: transparent; }
        .tab-active { border-bottom: 3px solid #3b82f6; color: #1e40af; }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const IconBase = ({ size = 20, children, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );
        const Play = (p) => <IconBase {...p}><polygon points="5 3 19 12 5 21 5 3"></polygon></IconBase>;
        const Pause = (p) => <IconBase {...p}><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></IconBase>;
        const RotateCcw = (p) => <IconBase {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></IconBase>;
        const Trash = (p) => <IconBase {...p}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></IconBase>;

        const App = () => {
            const [homeName, setHomeName] = useState('Home Team');
            const [awayName, setAwayName] = useState('Away Team');
            const [logs, setLogs] = useState([]); 
            const [timeLeft, setTimeLeft] = useState(900);
            const [isRunning, setIsRunning] = useState(false);
            const [quarter, setQuarter] = useState(1);
            const [activeTab, setActiveTab] = useState('score');
            
            // Logic state
            const [firstCenterPassOfMatch, setFirstCenterPassOfMatch] = useState(null); 
            const [manualCenterPass, setManualCenterPass] = useState(null);

            // Corrected Netball Center Pass Logic:
            // It alternates every time a goal is scored, regardless of WHICH team scored.
            const currentCenterPass = useMemo(() => {
                if (manualCenterPass) return manualCenterPass;
                if (!firstCenterPassOfMatch) return null;
                
                // Sequence logic: The team that takes the center pass alternates after every goal.
                const totalGoals = logs.length;
                const isEven = totalGoals % 2 === 0;
                
                if (isEven) return firstCenterPassOfMatch;
                return firstCenterPassOfMatch === 'home' ? 'away' : 'home';
            }, [logs.length, firstCenterPassOfMatch, manualCenterPass]);

            useEffect(() => {
                let interval = null;
                if (isRunning && timeLeft > 0) {
                    interval = setInterval(() => setTimeLeft(t => t - 1), 1000);
                } else if (timeLeft === 0) {
                    setIsRunning(false);
                }
                return () => clearInterval(interval);
            }, [isRunning, timeLeft]);

            const formatTime = (s) => `${Math.floor(s / 60).toString().padStart(2, '0')}:${(s % 60).toString().padStart(2, '0')}`;

            const addGoal = (team, shooter) => {
                if (!firstCenterPassOfMatch) {
                    alert("Please select who has the first center pass of the match first!");
                    return;
                }
                const newGoal = {
                    id: Date.now(),
                    team,
                    shooter,
                    quarter,
                    time: formatTime(timeLeft)
                };
                setLogs([newGoal, ...logs]);
                setManualCenterPass(null); // Reset manual override after a goal moves the sequence forward
            };

            const removeGoal = (id) => {
                if(confirm("Remove this goal? The center pass will automatically revert to the correct team.")) {
                    setLogs(logs.filter(l => l.id !== id));
                    setManualCenterPass(null);
                }
            };

            const resetGame = () => {
                if(confirm("Reset entire match?")) {
                    setLogs([]);
                    setQuarter(1);
                    setTimeLeft(900);
                    setIsRunning(false);
                    setFirstCenterPassOfMatch(null);
                    setManualCenterPass(null);
                }
            };

            const homeScore = logs.filter(l => l.team === 'home').length;
            const awayScore = logs.filter(l => l.team === 'away').length;

            return (
                <div className="max-w-xl mx-auto min-h-screen flex flex-col font-sans">
                    {/* Header */}
                    <div className="bg-slate-900 text-white p-4 sticky top-0 z-20 shadow-lg">
                        <div className="flex justify-between items-center mb-4">
                            <span className="text-xl font-black italic tracking-widest text-blue-400">NETBALL PRO</span>
                            <div className="bg-slate-800 px-3 py-1 rounded-full text-xs font-bold uppercase">Quarter {quarter}</div>
                        </div>
                        
                        <div className="flex items-center justify-between bg-slate-800 rounded-2xl p-4">
                            <div className="text-4xl font-mono font-bold tabular-nums">{formatTime(timeLeft)}</div>
                            <div className="flex gap-2">
                                <button onClick={() => setIsRunning(!isRunning)} className={`p-3 rounded-full transition-colors ${isRunning ? 'bg-amber-500' : 'bg-emerald-500'}`}>
                                    {isRunning ? <Pause size={24} fill="white" /> : <Play size={24} fill="white" />}
                                </button>
                                <button onClick={() => setTimeLeft(900)} className="p-3 rounded-full bg-slate-700 active:bg-slate-600"><RotateCcw size={24} /></button>
                            </div>
                        </div>
                    </div>

                    {/* Setup Phase: Toss Winner */}
                    {!firstCenterPassOfMatch && (
                        <div className="p-6 bg-blue-600 text-white text-center animate-pulse">
                            <h2 className="font-bold mb-2">Who won the toss?</h2>
                            <p className="text-xs opacity-90 mb-4 italic">Select the team taking the First Center Pass of the match</p>
                            <div className="flex gap-4 justify-center">
                                <button onClick={() => setFirstCenterPassOfMatch('home')} className="bg-white text-blue-600 px-6 py-2 rounded-full font-black shadow-lg uppercase text-sm active:scale-95 transition-transform">{homeName}</button>
                                <button onClick={() => setFirstCenterPassOfMatch('away')} className="bg-white text-blue-600 px-6 py-2 rounded-full font-black shadow-lg uppercase text-sm active:scale-95 transition-transform">{awayName}</button>
                            </div>
                        </div>
                    )}

                    <div className="flex bg-white border-b border-slate-200">
                        <button onClick={() => setActiveTab('score')} className={`flex-1 py-4 font-bold text-sm uppercase tracking-wider ${activeTab === 'score' ? 'tab-active' : 'text-slate-400'}`}>Scoring</button>
                        <button onClick={() => setActiveTab('logs')} className={`flex-1 py-4 font-bold text-sm uppercase tracking-wider ${activeTab === 'logs' ? 'tab-active' : 'text-slate-400'}`}>Logs ({logs.length})</button>
                    </div>

                    <div className="p-4 flex-1 overflow-y-auto">
                        {activeTab === 'score' ? (
                            <div className="flex flex-col gap-4">
                                <div className="grid grid-cols-2 gap-4">
                                    {/* Home Team Card */}
                                    <div className={`p-4 rounded-2xl bg-white border-2 transition-all duration-300 ${currentCenterPass === 'home' ? 'border-blue-500 ring-4 ring-blue-100 scale-[1.02]' : 'border-transparent opacity-80'}`}>
                                        <input value={homeName} onChange={e => setHomeName(e.target.value)} className="w-full text-center font-bold text-slate-500 mb-1 bg-transparent text-sm focus:outline-none" />
                                        <div className="text-6xl font-black text-center mb-4 text-blue-600 tabular-nums">{homeScore}</div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <button onClick={() => addGoal('home', 'GS')} className="bg-blue-600 text-white py-4 rounded-xl font-black text-lg active:bg-blue-800 shadow-sm">GS</button>
                                            <button onClick={() => addGoal('home', 'GA')} className="bg-blue-500 text-white py-4 rounded-xl font-black text-lg active:bg-blue-800 shadow-sm">GA</button>
                                        </div>
                                    </div>

                                    {/* Away Team Card */}
                                    <div className={`p-4 rounded-2xl bg-white border-2 transition-all duration-300 ${currentCenterPass === 'away' ? 'border-rose-500 ring-4 ring-rose-100 scale-[1.02]' : 'border-transparent opacity-80'}`}>
                                        <input value={awayName} onChange={e => setAwayName(e.target.value)} className="w-full text-center font-bold text-slate-500 mb-1 bg-transparent text-sm focus:outline-none" />
                                        <div className="text-6xl font-black text-center mb-4 text-rose-600 tabular-nums">{awayScore}</div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <button onClick={() => addGoal('away', 'GS')} className="bg-rose-600 text-white py-4 rounded-xl font-black text-lg active:bg-rose-800 shadow-sm">GS</button>
                                            <button onClick={() => addGoal('away', 'GA')} className="bg-rose-500 text-white py-4 rounded-xl font-black text-lg active:bg-rose-800 shadow-sm">GA</button>
                                        </div>
                                    </div>
                                </div>

                                {/* Center Pass Indicator */}
                                <div className="flex flex-col items-center gap-2 py-4 bg-white rounded-2xl border border-slate-100 shadow-sm">
                                    <div className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Next Center Pass</div>
                                    <div className="flex items-center gap-6">
                                        <div className={`h-4 w-4 rounded-full transition-all ${currentCenterPass === 'home' ? 'bg-blue-500 scale-125 shadow-[0_0_12px_rgba(59,130,246,0.6)]' : 'bg-slate-200'}`}></div>
                                        <button 
                                            onClick={() => setManualCenterPass(currentCenterPass === 'home' ? 'away' : 'home')}
                                            className="text-[10px] font-bold text-slate-400 border border-slate-200 px-4 py-1.5 rounded-full hover:bg-slate-50 active:bg-slate-100 transition-colors uppercase"
                                        >
                                            Swap Turn
                                        </button>
                                        <div className={`h-4 w-4 rounded-full transition-all ${currentCenterPass === 'away' ? 'bg-rose-500 scale-125 shadow-[0_0_12px_rgba(244,63,94,0.6)]' : 'bg-slate-200'}`}></div>
                                    </div>
                                </div>

                                {/* Quarterly Summary */}
                                <div className="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
                                    <h3 className="text-[10px] font-black text-slate-400 uppercase mb-3 tracking-widest">Score Sheet Breakdown</h3>
                                    <div className="space-y-3">
                                        {[1, 2, 3, 4].map(q => {
                                            const qHome = logs.filter(l => l.team === 'home' && l.quarter === q).length;
                                            const qAway = logs.filter(l => l.team === 'away' && l.quarter === q).length;
                                            return (
                                                <div key={q} className={`flex justify-between items-center text-sm ${quarter === q ? 'font-bold text-slate-800' : 'text-slate-400'}`}>
                                                    <span className="flex items-center gap-2">
                                                        Quarter {q}
                                                        {quarter === q && <span className="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>}
                                                    </span>
                                                    <span className="font-mono bg-slate-50 px-3 py-1 rounded-md">{qHome} - {qAway}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="mt-4 flex gap-2">
                                    <button onClick={() => setQuarter(q => Math.min(4, q + 1))} className="flex-1 bg-slate-800 text-white py-4 rounded-xl font-black shadow-lg active:scale-[0.98] transition-transform uppercase text-sm tracking-widest">Next Quarter</button>
                                    <button onClick={resetGame} className="p-4 bg-white border border-slate-200 rounded-xl text-slate-400 hover:text-red-500 transition-colors"><Trash size={20} /></button>
                                </div>
                            </div>
                        ) : (
                            <div className="flex flex-col gap-2">
                                {logs.length === 0 ? (
                                    <div className="text-center py-20 text-slate-300 font-medium italic">No goals recorded yet...</div>
                                ) : (
                                    logs.map((log) => (
                                        <div key={log.id} className="flex items-center justify-between bg-white p-3 rounded-xl shadow-sm border border-slate-100">
                                            <div className="flex items-center gap-3">
                                                <div className={`w-9 h-9 rounded-lg flex items-center justify-center font-black text-sm text-white ${log.team === 'home' ? 'bg-blue-600' : 'bg-rose-600'}`}>
                                                    {log.shooter}
                                                </div>
                                                <div>
                                                    <div className="text-xs font-black text-slate-800 uppercase tracking-tight">{log.team === 'home' ? homeName : awayName}</div>
                                                    <div className="text-[10px] text-slate-400 font-bold uppercase tracking-tighter">Q{log.quarter} • {log.time}</div>
                                                </div>
                                            </div>
                                            <button onClick={() => removeGoal(log.id)} className="p-2 text-slate-300 hover:text-red-500 transition-colors"><Trash size={16} /></button>
                                        </div>
                                    ))
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
